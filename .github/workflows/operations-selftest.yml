name: CommandDesk Operations Self-Test

on:
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar Integrações Comunicações e Configurações
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://via-commanddesk-v4-1-pilot.vercel.app"
          EMAIL_ID="99999999-9999-4999-8999-999999999901"

          INTEGRATIONS=$(curl -fsS --max-time 30 "$BASE/api/integrations")
          echo "$INTEGRATIONS" | jq -e '.demo == true and .microsoft.syncAvailable == true' >/dev/null

          SETTINGS=$(curl -fsS --max-time 30 "$BASE/api/settings")
          ORIGINAL_JOB=$(echo "$SETTINGS" | jq -r '.user.job_title // ""')
          TEST_JOB="${ORIGINAL_JOB} QA-SELFTEST"
          PATCH_PAYLOAD=$(jq -nc --arg v "$TEST_JOB" '{jobTitle:$v}')
          PATCHED=$(curl -fsS --max-time 30 -X PATCH "$BASE/api/settings" -H 'Content-Type: application/json' --data "$PATCH_PAYLOAD")
          echo "$PATCHED" | jq -e --arg v "$TEST_JOB" '.user.job_title == $v' >/dev/null
          ME=$(curl -fsS --max-time 30 "$BASE/api/me")
          echo "$ME" | jq -e --arg v "$TEST_JOB" '.user.job_title == $v' >/dev/null
          RESTORE_PAYLOAD=$(jq -nc --arg v "$ORIGINAL_JOB" '{jobTitle:$v}')
          RESTORED=$(curl -fsS --max-time 30 -X PATCH "$BASE/api/settings" -H 'Content-Type: application/json' --data "$RESTORE_PAYLOAD")
          if [ -n "$ORIGINAL_JOB" ]; then echo "$RESTORED" | jq -e --arg v "$ORIGINAL_JOB" '.user.job_title == $v' >/dev/null; else echo "$RESTORED" | jq -e '.user.job_title == null' >/dev/null; fi

          COMM=$(curl -fsS --max-time 30 "$BASE/api/communications/$EMAIL_ID")
          echo "$COMM" | jq -e '.score == 72 and .unread == true and .action_suggested == true' >/dev/null
          READ=$(curl -fsS --max-time 30 -X PATCH "$BASE/api/communications/$EMAIL_ID" -H 'Content-Type: application/json' --data '{"unread":false}')
          echo "$READ" | jq -e '.unread == false' >/dev/null
          CREATED=$(curl -fsS --max-time 30 -X POST "$BASE/api/communications/$EMAIL_ID/task" -H 'Content-Type: application/json' --data '{"priority":"Alta"}')
          TASK_ID=$(echo "$CREATED" | jq -r '.task.id')
          test -n "$TASK_ID"
          SNAP=$(curl -fsS --max-time 30 "$BASE/api/snapshot")
          echo "$SNAP" | jq -e --arg id "$TASK_ID" '.tasks | any(.id == $id and .title == "SELFTEST OPS COMMUNICATION")' >/dev/null
          echo "$SNAP" | jq -e --arg id "$EMAIL_ID" --arg tid "$TASK_ID" '.emails | any(.id == $id and .task_id == $tid)' >/dev/null

          UI=$(curl -fsS --max-time 30 "$BASE/pilot-operations.js")
          printf '%s' "$UI" | grep -q "Microsoft 365 / Outlook"
          printf '%s' "$UI" | grep -q "Transformar em tarefa"
          printf '%s' "$UI" | grep -q "Salvar configurações"

          echo "task_id=$TASK_ID"
          echo "Operations self-test passed"
