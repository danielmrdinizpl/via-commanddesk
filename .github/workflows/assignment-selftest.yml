name: CommandDesk Assignment Self-Test

on:
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar projeto, responsável e isolamento
        shell: bash
        run: |
          set -euo pipefail
          URL="https://via-commanddesk-v4-1-pilot.vercel.app/api/selftest/assignments"
          for attempt in $(seq 1 18); do
            body=$(curl -sS --connect-timeout 10 --max-time 30 "$URL" || true)
            echo "attempt=${attempt} response=${body}"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "Assignment self-test passed"
              exit 0
            fi
            sleep 10
          done
          exit 1
