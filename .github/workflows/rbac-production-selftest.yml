name: CommandDesk RBAC Production Self-Test

on:
  push:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar RBAC e Outlook por usuário
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://via-commanddesk-v4-1-pilot.vercel.app"
          ADMIN="00000000-0000-0000-0000-000000000101"

          ME=$(curl -fsS --max-time 30 "$BASE/api/me")
          echo "$ME" | jq -e '.authenticated == true and .demo == true and .user.role == "admin"' >/dev/null
          echo "$ME" | jq -e '.permissions | index("team:manage") != null and index("projects:manage") != null and index("tasks:create:any") != null' >/dev/null

          INTEGRATIONS=$(curl -fsS --max-time 30 "$BASE/api/integrations")
          echo "$INTEGRATIONS" | jq -e '.demo == true' >/dev/null

          SYNC=$(curl -fsS --max-time 30 -X POST "$BASE/api/outlook/sync" -H 'Content-Type: application/json' --data '{}')
          echo "$SYNC" | jq -e '.ok == true and .mode == "demo"' >/dev/null

          SNAP=$(curl -fsS --max-time 30 "$BASE/api/snapshot")
          echo "$SNAP" | jq -e --arg uid "$ADMIN" '[.emails[] | select(.user_id != $uid)] | length == 0' >/dev/null

          RBAC=$(curl -fsS --max-time 30 "$BASE/pilot-rbac.js")
          printf '%s' "$RBAC" | grep -q "Vincular tenant Microsoft"
          printf '%s' "$RBAC" | grep -q "Membros só podem"

          echo "$ME" | jq -c '{role:.user.role,permissions:.permissions}'
          echo "$INTEGRATIONS" | jq -c '{demo,microsoft:{configured:.microsoft.configured,tenantLinked:.microsoft.tenantLinked,canBindTenant:.microsoft.canBindTenant}}'
          echo "$SYNC" | jq -c '{inserted,linked,actions,mode}'
          echo "RBAC production self-test passed"
