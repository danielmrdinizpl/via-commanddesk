name: CommandDesk Integration Secret Presence

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar apenas presença dos segredos
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        shell: bash
        run: |
          present(){ if [ -n "$2" ]; then echo "$1=present"; else echo "$1=missing"; fi; }
          present VERCEL_TOKEN "$VERCEL_TOKEN"
          present MICROSOFT_CLIENT_ID "$MICROSOFT_CLIENT_ID"
          present MICROSOFT_CLIENT_SECRET "$MICROSOFT_CLIENT_SECRET"
          present MICROSOFT_TENANT_ID "$MICROSOFT_TENANT_ID"
          present TOKEN_ENCRYPTION_KEY "$TOKEN_ENCRYPTION_KEY"
