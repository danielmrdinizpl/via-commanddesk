name: CommandDesk Search Project Self-Test

on:
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar Localizar e edição de Projeto
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://via-commanddesk-v4-1-pilot.vercel.app"
          SNAP=$(curl -fsS --max-time 30 "$BASE/api/snapshot")
          PROJECT_ID=$(echo "$SNAP" | jq -r '.projects[0].id')
          ORIGINAL_PROGRESS=$(echo "$SNAP" | jq -r '.projects[0].progress')
          if [ "$ORIGINAL_PROGRESS" -lt 100 ]; then NEW_PROGRESS=$((ORIGINAL_PROGRESS+1)); else NEW_PROGRESS=$((ORIGINAL_PROGRESS-1)); fi

          PATCHED=$(curl -fsS --max-time 30 -X PATCH "$BASE/api/projects/$PROJECT_ID" \
            -H 'Content-Type: application/json' \
            --data "{\"progress\":$NEW_PROGRESS}")
          echo "$PATCHED" | jq -e --argjson p "$NEW_PROGRESS" '.progress == $p' >/dev/null

          SNAP2=$(curl -fsS --max-time 30 "$BASE/api/snapshot")
          echo "$SNAP2" | jq -e --arg id "$PROJECT_ID" --argjson p "$NEW_PROGRESS" '.projects | any(.id == $id and .progress == $p)' >/dev/null

          RESTORED=$(curl -fsS --max-time 30 -X PATCH "$BASE/api/projects/$PROJECT_ID" \
            -H 'Content-Type: application/json' \
            --data "{\"progress\":$ORIGINAL_PROGRESS}")
          echo "$RESTORED" | jq -e --argjson p "$ORIGINAL_PROGRESS" '.progress == $p' >/dev/null

          SEARCH=$(curl -fsS --max-time 30 "$BASE/pilot-search.js")
          printf '%s' "$SEARCH" | grep -q "input.oninput"
          printf '%s' "$SEARCH" | grep -q "type: 'Tarefa'"
          printf '%s' "$SEARCH" | grep -q "type: 'Projeto'"
          printf '%s' "$SEARCH" | grep -q "type: 'Pessoa'"
          printf '%s' "$SEARCH" | grep -q "type: 'Comunicação'"
          printf '%s' "$SEARCH" | grep -q "CommandDeskEntities"

          FINAL=$(curl -fsS --max-time 30 "$BASE/api/snapshot")
          echo "$FINAL" | jq -e --arg id "$PROJECT_ID" --argjson p "$ORIGINAL_PROGRESS" '.projects | any(.id == $id and .progress == $p)' >/dev/null

          echo "project_id=$PROJECT_ID original=$ORIGINAL_PROGRESS tested=$NEW_PROGRESS restored=$ORIGINAL_PROGRESS"
          echo "Search and project edit self-test passed"
